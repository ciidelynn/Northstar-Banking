<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Bank - ประวัติการทำรายการ</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #0a192f 60%, #020617 100%); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            box-sizing: border-box;
            padding: 30px 20px;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.15s ease-in;
        }
        body.loaded { opacity: 1; }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Layout ตามภาพที่ 2 */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .back-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }
        .page-title { 
            font-size: 18px; 
            font-weight: 700; 
            color: #f8fafc; 
        }

        /* Card แสดงชื่อและเลขบัญชีตามภาพที่ 2 */
        .info-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 16px;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 30px;
        }
        .info-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .info-value {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            word-break: break-word;
        }

        /* รายการประวัติธุรกรรม */
        .history-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ตัวแสดงผลตอนไม่มีข้อมูล */
        .empty-state {
            width: 100%;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-top: 40px;
        }

        /* การ์ดแต่ละรายการโอน */
        .tx-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tx-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .tx-title {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
        }
        .tx-sub {
            font-size: 11px;
            color: #94a3b8;
        }
        .tx-amount {
            font-size: 15px;
            font-weight: 700;
        }
        .tx-amount.out { color: #f87171; }
        .tx-amount.in { color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <a href="dashboard.html" class="back-btn">‹ กลับหน้าหลัก</a>
            <div class="page-title">ประวัติการทำรายการ</div>
        </div>

        <!-- Account Status Card -->
        <div class="info-card">
            <div class="info-label">กำลังแสดงข้อมูลของบัญชี</div>
            <div class="info-value" id="accountInfo">กำลังโหลด...</div>
        </div>

        <!-- History List Area -->
        <div class="history-list" id="historyList">
            <div class="empty-state" id="loadingState">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore();
        let currentUser = null;
        let activeAccount = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadHistoryData();
            } else {
                window.location.replace("index.html");
            }
        });

        async function loadHistoryData() {
            const currentAccId = localStorage.getItem("current_account_id_" + currentUser.uid);
            if (!currentAccId) {
                window.location.replace("dashboard.html");
                return;
            }

            try {
                // 1. ดึงข้อมูลบัญชีปัจจุบัน
                const accQuery = query(collection(db, "accounts"), where("__name__", "==", currentAccId));
                const accSnap = await getDocs(accQuery);
                
                if (accSnap.empty) {
                    window.location.replace("dashboard.html");
                    return;
                }

                accSnap.forEach((doc) => {
                    activeAccount = doc.data();
                });

                // แสดงชื่อบัญชีและเลขบัญชีด้านบน
                document.getElementById("accountInfo").innerText = `${activeAccount.accountName} (${activeAccount.accountNumber})`;
                document.body.classList.add("loaded");

                // 2. ดึงประวัติการทำรายการ 30 วันล่าสุด
                const txListElement = document.getElementById("historyList");
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

                const txQuerySender = query(
                    collection(db, "transactions"), 
                    where("senderAccountNumber", "==", activeAccount.accountNumber)
                );
                const txQueryReceiver = query(
                    collection(db, "transactions"), 
                    where("receiverAccountNumber", "==", activeAccount.accountNumber)
                );

                const [senderSnap, receiverSnap] = await Promise.all([
                    getDocs(txQuerySender),
                    getDocs(txQueryReceiver)
                ]);

                let transactions = [];

                senderSnap.forEach((doc) => {
                    const data = doc.data();
                    const txTime = data.timestamp ? data.timestamp.toDate() : new Date();
                    if (txTime >= thirtyDaysAgo) {
                        transactions.push({ ...data, type: 'out', time: txTime });
                    }
                });

                receiverSnap.forEach((doc) => {
                    const data = doc.data();
                    const txTime = data.timestamp ? data.timestamp.toDate() : new Date();
                    if (txTime >= thirtyDaysAgo) {
                        transactions.push({ ...data, type: 'in', time: txTime });
                    }
                });

                // เรียงลำดับรายการจากใหม่ไปเก่า
                transactions.sort((a, b) => b.time - a.time);

                // 3. แสดงผล (ถ้าไม่มีรายการให้โชว์ Empty State แต่ถ้ามีรายการจะเรนเดอร์การ์ดรายการแทน)
                if (transactions.length === 0) {
                    txListElement.innerHTML = `<div class="empty-state">ไม่มีประวัติการทำรายการใน 30 วันนี้</div>`;
                } else {
                    txListElement.innerHTML = "";
                    transactions.forEach(tx => {
                        const dateStr = tx.time.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });
                        const timeStr = tx.time.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                        
                        const isOut = tx.type === 'out';
                        const title = isOut ? `โอนไปยัง ${tx.receiverName}` : `รับโอนจาก ${tx.senderName}`;
                        const subTitle = isOut ? tx.receiverAccountNumber : tx.senderAccountNumber;
                        const sign = isOut ? '-' : '+';
                        const amountClass = isOut ? 'out' : 'in';

                        const cardHTML = `
                            <div class="tx-card">
                                <div class="tx-details">
                                    <div class="tx-title">${title}</div>
                                    <div class="tx-sub">${subTitle} • ${dateStr} ${timeStr}</div>
                                </div>
                                <div class="tx-amount ${amountClass}">${sign}${tx.amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                            </div>
                        `;
                        txListElement.innerHTML += cardHTML;
                    });
                }

            } catch (error) {
                console.error("Error loading history:", error);
                document.getElementById("historyList").innerHTML = `<div class="empty-state">เกิดข้อผิดพลาดในการดึงข้อมูล</div>`;
            }
        }
    </script>
</body>
</html>
