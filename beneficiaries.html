<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Bank - รายชื่อผู้รับเงิน</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #0a192f 60%, #020617 100%); 
            display: flex; 
            flex-direction: column;
            justify-content: space-between; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            box-sizing: border-box;
            padding: 30px 20px;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.15s ease-in;
        }
        body.loaded { opacity: 1; }
        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .page-title { font-size: 16px; font-weight: 700; color: #f8fafc; }
        
        .action-header-btn {
            background: #38bdf8;
            color: #0a192f;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }
        .action-header-btn:hover { background: #0ea5e9; }

        .cute-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 16px;
        }
        .cute-input:focus { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }

        .beneficiary-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .beneficiary-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .beneficiary-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.05);
        }
        .b-name { font-size: 15px; font-weight: 700; color: #f8fafc; margin-bottom: 3px; }
        .b-number { font-size: 12px; color: #94a3b8; letter-spacing: 1px; }
        
        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.3); }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 40px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-card {
            background: #112240;
            border: 1px solid rgba(56, 189, 248, 0.25);
            width: 88%;
            max-width: 320px;
            border-radius: 24px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: left;
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #ffffff; text-align: center; }
        .form-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; display: block; }
        .modal-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .modal-action-btn {
            background: #38bdf8;
            color: #0a192f;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .modal-close-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="dashboard.html" class="back-btn">‹ กลับหน้าหลัก</a>
            <div class="page-title">รายชื่อผู้รับเงิน</div>
            <div style="width: 60px;"></div>
        </div>

        <button class="action-header-btn" onclick="openAddModal()">+ เพิ่มรายชื่อผู้รับเงิน</button>

        <input type="text" id="searchInput" class="cute-input" placeholder="🔍 ค้นหาชื่อหรือเลขบัญชี..." oninput="filterBeneficiaries()">

        <div class="beneficiary-list" id="beneficiaryListContainer">
            <div class="empty-state">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- Modal เพิ่มรายชื่อ -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-card">
            <div class="modal-title">✨ เพิ่มผู้รับเงินใหม่</div>
            
            <div class="form-group" style="margin-bottom: 14px;">
                <label class="form-label">ชื่อที่ต้องการเซฟ (ชื่อเล่น)</label>
                <input type="text" id="savedNameInput" class="cute-input" placeholder="เช่น แม่, เพื่อนสนิท" style="margin-bottom: 0;">
            </div>

            <div class="form-group" style="margin-bottom: 18px;">
                <label class="form-label">เลขบัญชีปลายทาง (13 หลัก รวมขีด)</label>
                <input type="text" id="savedAccNumberInput" class="cute-input" placeholder="000-00-0000-0" maxlength="13" oninput="formatAccountNumber(this)" style="margin-bottom: 0;">
            </div>

            <div class="modal-btn-row">
                <button class="modal-close-btn" onclick="closeAddModal()">ยกเลิก</button>
                <button class="modal-action-btn" onclick="confirmAddBeneficiary()">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนทั่วไป -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-card" style="text-align: center;">
            <div style="font-size: 36px; margin-bottom: 10px;" id="alertIcon">🎉</div>
            <div class="modal-title" id="alertTitle" style="margin-bottom: 8px;">สำเร็จ!</div>
            <div id="alertMessage" style="font-size: 14px; color: #94a3b8; margin-bottom: 20px;">ดำเนินการเรียบร้อยแล้วค่ะ</div>
            <button class="modal-action-btn" onclick="closeAlertModal()">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore();
        let currentUser = null;
        let beneficiariesData = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadBeneficiaries();
                document.body.classList.add("loaded");
            } else {
                window.location.replace("index.html");
            }
        });

        async function loadBeneficiaries() {
            try {
                const q = query(collection(db, "beneficiaries"), where("userId", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);

                beneficiariesData = [];
                querySnapshot.forEach((docSnap) => {
                    beneficiariesData.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderBeneficiaries(beneficiariesData);
            } catch (error) {
                console.error("Error loading beneficiaries:", error);
                document.getElementById("beneficiaryListContainer").innerHTML = `<div class="empty-state">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
            }
        }

        function renderBeneficiaries(list) {
            const container = document.getElementById("beneficiaryListContainer");
            container.innerHTML = "";

            if (list.length === 0) {
                container.innerHTML = `<div class="empty-state">ยังไม่มีรายชื่อผู้รับเงินที่บันทึกไว้</div>`;
                return;
            }

            list.forEach(item => {
                container.innerHTML += `
                    <div class="beneficiary-card" onclick="selectBeneficiary('${item.accountNumber}')">
                        <div>
                            <div class="b-name">${item.savedName}</div>
                            <div class="b-number">${item.accountNumber}</div>
                        </div>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteBeneficiary('${item.id}')">ลบ</button>
                    </div>
                `;
            });
        }

        window.filterBeneficiaries = function() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered = beneficiariesData.filter(item => 
                item.savedName.toLowerCase().includes(keyword) || 
                item.accountNumber.includes(keyword)
            );
            renderBeneficiaries(filtered);
        }

        window.openAddModal = function() {
            document.getElementById("savedNameInput").value = "";
            document.getElementById("savedAccNumberInput").value = "";
            document.getElementById("addModal").classList.add("show");
        }

        window.closeAddModal = function() {
            document.getElementById("addModal").classList.remove("show");
        }

        window.formatAccountNumber = function(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 3 && v.length <= 5) v = v.slice(0,3) + '-' + v.slice(3);
            else if (v.length > 5 && v.length <= 9) v = v.slice(0,3) + '-' + v.slice(3,5) + '-' + v.slice(5);
            else if (v.length > 9) v = v.slice(0,3) + '-' + v.slice(3,5) + '-' + v.slice(5,9) + '-' + v.slice(9,10);
            input.value = v;
        }

        window.confirmAddBeneficiary = async function() {
            const savedName = document.getElementById("savedNameInput").value.trim();
            const accountNumber = document.getElementById("savedAccNumberInput").value.trim();

            if (!savedName) {
                showAlert("แจ้งเตือน", "กรุณากรอกชื่อที่ต้องการเซฟ", "⚠️");
                return;
            }
            if (accountNumber.length < 13) {
                showAlert("แจ้งเตือน", "กรุณากรอกเลขบัญชีให้ครบถ้วน (13 หลักรวมขีด)", "⚠️");
                return;
            }

            try {
                const newBeneficiary = {
                    userId: currentUser.uid,
                    savedName: savedName,
                    accountNumber: accountNumber
                };

                const docRef = await addDoc(collection(db, "beneficiaries"), newBeneficiary);
                beneficiariesData.push({ id: docRef.id, ...newBeneficiary });
                
                closeAddModal();
                renderBeneficiaries(beneficiariesData);
                showAlert("สำเร็จ!", "บันทึกรายชื่อผู้รับเงินเรียบร้อยแล้วค่ะ ✨", "🎉");
            } catch (error) {
                console.error("Error adding beneficiary:", error);
                showAlert("ผิดพลาด", "ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่", "❌");
            }
        }

        window.deleteBeneficiary = async function(id) {
            if (!confirm("ต้องการลบรายชื่อนี้ใช่ไหมคะ?")) return;
            try {
                await deleteDoc(doc(db, "beneficiaries", id));
                beneficiariesData = beneficiariesData.filter(item => item.id !== id);
                renderBeneficiaries(beneficiariesData);
            } catch (error) {
                console.error("Error deleting:", error);
            }
        }

        // ส่งเลขบัญชีผ่าน URL Parameter ไปยังหน้าโอนเงิน
        window.selectBeneficiary = function(accountNumber) {
            window.location.href = `transfer.html?target=${encodeURIComponent(accountNumber)}`;
        }

        window.showAlert = function(title, message, icon = "🎉") {
            document.getElementById("alertIcon").innerText = icon;
            document.getElementById("alertTitle").innerText = title;
            document.getElementById("alertMessage").innerText = message;
            document.getElementById("alertModal").classList.add("show");
        }
        window.closeAlertModal = function() {
            document.getElementById("alertModal").classList.remove("show");
        }
    </script>
</body>
</html>
